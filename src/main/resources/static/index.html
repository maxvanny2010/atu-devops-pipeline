<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<main class="page">
    <header class="page-header">
        <div class="eyebrow">DEVOPS DEMO APPLICATION</div>
        <h1>Task Manager</h1>
        <p>Keep track of what needs to get done.</p>
    </header>

    <section class="panel" aria-labelledby="create-heading">
        <h2 id="create-heading">New task</h2>

        <form id="task-form">
            <label for="task-title">Task description</label>
            <div class="form-row">
                <input
                        id="task-title"
                        name="title"
                        type="text"
                        maxlength="120"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        required
                >
                <button id="add-button" type="submit">Add task</button>
            </div>
        </form>
    </section>

    <section class="panel tasks-panel" aria-labelledby="tasks-heading">
        <div class="section-header">
            <div>
                <h2 id="tasks-heading">Your tasks</h2>
                <p id="task-summary" class="summary">Loading tasks...</p>
            </div>
            <button id="refresh-button" class="secondary" type="button">
                Refresh
            </button>
        </div>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <p id="empty-state" class="empty" hidden>
            No tasks yet. Add your first task above.
        </p>
        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
    </section>

    <footer>Spring Boot REST API · Java 21 · DevSecOps Pipeline</footer>
</main>
</body>
</html>
