name: Docker Negative Runtime Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-tests:
    name: Docker negative runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build --tag atu-task-manager:ci .

      - name: Run negative runtime tests
        env:
          IMAGE_NAME: atu-task-manager:ci
        run: bash scripts/docker/negative-tests.sh
