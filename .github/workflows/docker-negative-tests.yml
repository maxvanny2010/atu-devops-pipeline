name: Docker Negative Runtime Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-tests:
    name: Docker negative runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build Docker image
        run: docker build --tag atu-task-manager:ci .

      - name: Run negative runtime tests
        env:
          IMAGE_NAME: atu-task-manager:ci
        run: bash scripts/docker/negative-tests.sh
