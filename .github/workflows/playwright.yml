name: Playwright E2E

on:
  pull_request:
    branches: [ master ]
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Task Manager Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Spring Boot application
        run: mvn --batch-mode --no-transfer-progress package

      - name: Start Spring Boot
        run: |
          java -jar target/task-manager-0.0.1-SNAPSHOT.jar \
            --server.port=8081 > spring-boot.log 2>&1 &
          echo $! > spring-boot.pid

      - name: Wait for application health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:8081/actuator/health > /dev/null; then
              echo "Spring Boot is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Spring Boot did not become ready."
          cat spring-boot.log
          exit 1

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-e2e-evidence
          path: |
            playwright-report/
            test-results/
            spring-boot.log
          if-no-files-found: warn
          retention-days: 14
