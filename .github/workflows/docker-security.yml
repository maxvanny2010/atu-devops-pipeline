name: Docker Build and Security Scan

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build --tag atu-task-manager:ci .

      - name: Docker runtime smoke tests
        env:
          IMAGE_NAME: atu-task-manager:ci
        run: bash scripts/docker/smoke-test.sh
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: atu-task-manager:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 20m
          format: table
          hide-progress: true