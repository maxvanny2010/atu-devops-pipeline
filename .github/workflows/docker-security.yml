name: Docker Build and Security Scan

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag atu-task-manager:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: atu-task-manager:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 20m
          format: table
          hide-progress: true