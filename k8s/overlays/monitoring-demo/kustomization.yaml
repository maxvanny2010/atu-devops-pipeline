apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-demo

resources:
  - namespace.yaml
  - ../../base
  - ../../monitoring

patches:
  - target:
      kind: Deployment
      name: task-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: task-manager:monitoring-local
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
